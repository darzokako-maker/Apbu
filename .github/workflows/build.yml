
name: Windows EXE Oluşturucu

# Bu iş akışı, her 'main' dalına push yapıldığında veya manuel olarak tetiklendiğinde çalışır.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Kodu depodan çekiyoruz
    - name: Kodu Çek (Checkout)
      uses: actions/checkout@v4

    # 2. Python ortamını kuruyoruz
    - name: Python Ortamını Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # 3. Gerekli tüm kütüphaneleri requirements.txt dosyasından ve PyInstaller'ı yüklüyoruz
    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    # 4. PyInstaller ile uygulamayı tek bir .exe haline getiriyoruz
    - name: Windows EXE Derle
      run: |
        pyinstaller --onefile --noconsole --collect-all customtkinter --name="AICodeStudio" main.py

    # 5. Oluşturulan .exe dosyasını GitHub üzerinde indirilebilir bir ürün olarak yüklüyoruz
    - name: Derlenen EXE'yi Sunucuya Yükle
      uses: actions/upload-artifact@v4
      with:
        name: AICodeStudio-Windows
        path: dist/AICodeStudio.exe

```

